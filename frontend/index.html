<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Class Conflict Checker</title>
  </head>
  <body style="font-family: Arial, sans-serif; margin: 20px">
    <h1>📚 Class Conflict & Overcapacity Checker</h1>

    <label for="crnInput">Enter CRN:</label>
    <input type="text" id="crnInput" placeholder="e.g., 12345" />
    <button onclick="checkConflict()">Check</button>

    <div id="result" style="margin-top: 20px"></div>
    <!-- Embed Tableau Dashboard Below -->
    <h2 style="margin-top: 50px">📊 Class Conflict & Overcapacity Dashboard</h2>

    <div style="max-width: 1200px; margin: auto">
      <iframe
        src="https://public.tableau.com/views/profV/Dashboard1?:embed=true&:display_count=yes&:showVizHome=no"
        width="100%"
        height="800px"
        style="border: none"
      >
      </iframe>
    </div>

    <script>
      async function checkConflict() {
        const crn = document.getElementById("crnInput").value.trim();
        const resultDiv = document.getElementById("result");

        if (!crn) {
          resultDiv.innerHTML =
            "<p style='color: red;'>Please enter a CRN!</p>";
          return;
        }

        try {
          const response = await fetch(
            "https://industrialmathfinalproject.onrender.com/predict?crn=" + crn
          );

          const data = await response.json();

          if (data.error) {
            resultDiv.innerHTML = `<p style='color: red;'>${data.error}</p>`;
            return;
          }

          let html = `
                    <h3>Result for CRN: ${data.crn}</h3>
                    <p><strong>Building:</strong> ${data.building}</p>
                    <p><strong>Room:</strong> ${data.room}</p>
                    <p><strong>Begin Time:</strong> ${data.begintime}</p>
                    <p><strong>End Time:</strong> ${data.endtime}</p>
                    <h4>Messages:</h4>
                    <ul>
                        ${data.messages
                          .map((msg) => `<li>${msg}</li>`)
                          .join("")}
                    </ul>
                    <h4>Notes:</h4>
                    <ul>
                        <li><strong>Overlap Minutes:</strong> ${
                          data.notes.overlap_minutes ?? "None"
                        }</li>
                        <li><strong>Overcapacity Percent:</strong> ${
                          data.notes.overcapacity_percent ?? "None"
                        }</li>
                    </ul>
                `;

          resultDiv.innerHTML = html;
        } catch (error) {
          resultDiv.innerHTML = `<p style='color: red;'>Error contacting server: ${error.message}</p>`;
        }
      }
    </script>
  </body>
</html>
